# ============================================================================
# CI dell'APPLICAZIONE (app/) — il cancello che finora non esisteva.
#
# ⚠️ PERCHÉ ESISTE. Fino a oggi l'unico workflow di questo repository era
# `site.yml`, che pubblica la vetrina. Trenta comandi di test, il typecheck, la
# build e i quattro controlli di governance non venivano eseguiti da nessuna
# macchina, mai. La prova che non è un problema teorico: un controllo di qualità
# è rimasto ROSSO su `main` senza che nessuno lo sapesse, perché nulla lo
# eseguiva.
#
# LA STRUTTURA, e le ragioni delle tre separazioni:
#
#   1. `quality-and-unit` — gira SEMPRE, su ogni pull request, anche da un fork
#      e anche senza alcun segreto. Sono 1500+ asserzioni che non toccano né
#      rete né credenziali: se non passano, non si unisce.
#
#   2. `database-ephemeral` — gira SEMPRE, su ogni pull request, e **senza un
#      solo segreto**. Il runner avvia un Supabase locale (`supabase start`),
#      che applica le 34 migrazioni a un database VUOTO, semina il catalogo ed
#      esegue le undici suite che hanno bisogno di UN database — non del
#      progetto di produzione. A fine esecuzione tutto viene distrutto.
#
#      ⚠️ PERCHÉ NON UN PROGETTO SUPABASE DEDICATO, che era il piano: l'organi-
#      zzazione è sul piano `free` e ha già 2 progetti su 2. Un terzo costava
#      il passaggio a Pro. Ma l'effimero non è un ripiego — è meglio: nessun
#      segreto significa che il job gira anche sulle pull request da un FORK,
#      dove i segreti non arrivano per costruzione.
#
#      ⚠️ E VERIFICA UNA COSA CHE NON ERA MAI STATA VERIFICATA IN DUE MESI:
#      che le migrazioni si applichino DA ZERO. Finora si sapeva solo che
#      l'installazione incrementale funzionava, perché il database di sviluppo
#      è lo stesso da luglio. La trappola 55P04 della 0015 — un valore enum
#      aggiunto e usato nella stessa transazione — era esattamente del tipo che
#      «si sarebbe visto al primo cliente nuovo», e nessuno era mai stato il
#      primo cliente nuovo.
#
#   3. `production-suites` — gira SOLO a comando e SOLO se i segreti esistono.
#      ⚠️ Non sono le suite «lente»: sono le tre che provano QUEL progetto e
#      non il prodotto — la configurazione di autenticazione, il contenuto vero
#      del catalogo, le Edge Function deployate. Su un database effimero
#      passerebbero senza provare niente, ed è per questo che il gruppo
#      `production` del runner si RIFIUTA di girare contro `127.0.0.1`.
#
#   4. `ai-evaluations` — gira solo a comando e solo se chiesto esplicitamente.
#      Consuma credito Anthropic vero. Non deve poter partire per sbaglio.
#
# ⚠️ Un job saltato per mancanza di segreti NON deve somigliare a un job
# superato: il job `preflight` lo dichiara con una annotazione visibile nel
# riepilogo dell'esecuzione, e il job database resta «skipped» nell'interfaccia.
# ============================================================================
name: App → qualità e test

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app-ci.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app-ci.yml'
  workflow_dispatch:
    inputs:
      run_production:
        description: 'Esegui le suite che provano il PROGETTO REALE (ci scrivono dentro)'
        type: boolean
        default: false
      run_evaluations:
        description: 'Esegui le valutazioni AI (CONSUMANO credito Anthropic)'
        type: boolean
        default: false

# Il minimo indispensabile: questo workflow legge il codice e non pubblica nulla.
permissions:
  contents: read

# Una esecuzione per branch. ⚠️ `cancel-in-progress` è attivo solo per gli
# eventi automatici: interrompere a metà un'esecuzione manuale che sta scrivendo
# nel database reale lascerebbe dati di prova in produzione, che è esattamente
# il difetto che `cleanup()` di test-inbox aveva già prodotto una volta.
concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    working-directory: app

jobs:
  # -------------------------------------------------------------------------
  # 1. Il cancello vero. Nessun segreto, nessuna rete, nessuna spesa.
  # -------------------------------------------------------------------------
  quality-and-unit:
    name: Qualità e unità (senza segreti)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installazione riproducibile
        run: npm ci

      # `ci` = quality + unit. Il runner si ferma al primo rosso (è il
      # comportamento predefinito) e propaga l'exit code.
      - name: Suite senza credenziali
        run: npm run ci

  # -------------------------------------------------------------------------
  # 2. IL CANCELLO CHE FINORA NON GIRAVA MAI.
  #
  # Undici suite su database, a ogni pull request, senza un solo segreto. Il
  # database nasce vuoto, riceve le 34 migrazioni, vive qualche minuto e muore.
  # -------------------------------------------------------------------------
  database-ephemeral:
    name: Database effimero (senza segreti)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installazione riproducibile
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # ⚠️ È QUI che si scopre se una migrazione non sa applicarsi da zero:
      # `supabase start` le esegue in ordine su un database vuoto. Se la 55P04
      # della 0015 si ripresentasse in una migrazione futura, questo passo
      # diventerebbe rosso — e oggi nessun altro controllo se ne accorgerebbe,
      # perché `db:bundle --check` legge i file, non li esegue.
      - name: Avviare Supabase e applicare le migrazioni da ZERO
        run: supabase start

      # ⚠️ Le chiavi di un'istanza locale NON sono segreti: sono le stesse per
      # ogni sviluppatore che esegue `supabase start`, valgono solo su
      # 127.0.0.1 e muoiono col container. Vengono comunque scritte con
      # `umask 077` e mai stampate.
      #
      # ⚠️ NESSUN RIPIEGO: se una delle tre variabili non si ricava dallo
      # stato, il passo FALLISCE. Un `.env.test` composto a metà darebbe suite
      # rosse per la ragione sbagliata, e si passerebbe un'ora a cercare un
      # difetto che non c'è.
      - name: Comporre .env.test dall'istanza locale
        run: |
          set -euo pipefail
          umask 077
          supabase status -o env > .supabase-status

          # ⚠️ I valori si estraggono PRIMA e si controllano DOPO, fuori da
          #    qualunque `$(...)`. Un `exit 1` dentro una sostituzione di
          #    comando esce dal SUBSHELL e non dal passo: il job proseguirebbe
          #    con una variabile vuota, cioè con un fallback silenzioso — la
          #    cosa che questo repository ha già pagato tre volte.
          val() { grep -E "^$1=" .supabase-status | head -1 | cut -d= -f2- | tr -d '"'; }
          URL_V=$(val API_URL)
          ANON_V=$(val ANON_KEY)
          SERVICE_V=$(val SERVICE_ROLE_KEY)

          for nome in URL_V ANON_V SERVICE_V; do
            eval "valore=\${$nome}"
            if [ -z "$valore" ]; then
              echo "::error title=Stato Supabase incompleto::$nome non si ricava da 'supabase status -o env'. Le undici suite NON sono state eseguite: non sono verdi."
              exit 1
            fi
          done

          {
            printf 'SUPABASE_URL=%s\n'              "$URL_V"
            printf 'SUPABASE_ANON_KEY=%s\n'         "$ANON_V"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SERVICE_V"
          } > .env.test
          rm -f .supabase-status

      # ⚠️⚠️ IL PEZZO PIÙ IMPORTANTE DI QUESTO JOB, e non era previsto.
      #
      # Alla prima esecuzione il seed è fallito con «permission denied for
      # table subsidy_sources» USANDO LA CHIAVE DI SERVIZIO. La diagnostica ha
      # dato la causa, ed è una differenza fra i due ambienti che nessuno
      # conosceva:
      #
      #   produzione   pg_default_acl per il ruolo `postgres` in `public`:
      #                anon/authenticated/service_role = arwdDxt  (DML compresa)
      #   locale (CLI) stesso posto:
      #                anon/authenticated/service_role = Dxt      (SOLO truncate,
      #                                                            references, trigger)
      #
      # ⚠️ LA CONSEGUENZA VA CAPITA PRIMA DI AGGIRARLA: le nostre migrazioni
      #    non concedono MAI esplicitamente la DML di base — `companies` non ha
      #    un solo `grant` in tutto il repository. Funziona perché la
      #    piattaforma l'aveva già concessa per default. È la stessa dipendenza
      #    implicita che nella 0013 aveva prodotto il difetto peggiore del
      #    progetto, vista dall'altro lato: là il default concedeva TROPPO, qui
      #    la sua assenza non concede abbastanza.
      #
      # Qui si RICOSTRUISCE l'ordine di costruzione della produzione: prima i
      # privilegi predefiniti, poi le migrazioni. Non si aggiunge un `grant`
      # finché il verde arriva — quello nasconderebbe la differenza invece di
      # riprodurla, e il database della CI smetterebbe di somigliare a quello
      # vero proprio nella cosa che questo repository controlla di più.
      - name: Ricostruire lo schema con i privilegi predefiniti della produzione
        run: |
          set -euo pipefail
          DB=$(supabase status -o env | grep -E '^DB_URL=' | head -1 | cut -d= -f2- | tr -d '"')
          if [ -z "$DB" ]; then
            echo "::error title=DB_URL assente::non si ricava da 'supabase status -o env'."
            exit 1
          fi

          psql "$DB" -v ON_ERROR_STOP=1 <<'SQL'
          drop schema public cascade;
          create schema public;
          grant usage  on schema public to postgres, anon, authenticated, service_role;
          grant create on schema public to postgres;
          alter default privileges in schema public grant all on tables    to anon, authenticated, service_role;
          alter default privileges in schema public grant all on sequences to anon, authenticated, service_role;
          alter default privileges in schema public grant all on functions to anon, authenticated, service_role;
          SQL

          for f in supabase/migrations/*.sql; do
            echo "── $(basename "$f")"
            psql "$DB" -v ON_ERROR_STOP=1 -q -f "$f"
          done

          # PostgREST tiene in cache lo schema: dopo averlo ricostruito da capo
          # servirebbe una vita intera di 404 per capire perché. Si ricarica.
          psql "$DB" -v ON_ERROR_STOP=1 -c "notify pgrst, 'reload schema';"
          sleep 3

      # ⚠️ LA RICOSTRUZIONE SI AUTOVERIFICA SUI DUE LATI, ed è il punto: se la
      # baseline non fosse tornata, le suite fallirebbero tutte e si darebbe la
      # colpa al prodotto; se le restrizioni delle migrazioni fossero state
      # cancellate dalla baseline, le suite passerebbero su un database più
      # permissivo di quello vero — un verde che vale meno di un rosso.
      # ⚠️ LA RICOSTRUZIONE SI AUTOVERIFICA SUI DUE LATI, ed è il punto.
      # Se la baseline non fosse tornata, le undici suite fallirebbero tutte e
      # si darebbe la colpa al prodotto. Se invece la baseline avesse
      # CANCELLATO le restrizioni delle migrazioni, passerebbero su un database
      # più permissivo di quello vero — e un verde ottenuto su garanzie assenti
      # vale meno di un rosso. Un controllo che guarda un lato solo non vede
      # l'altro fallire: è la lezione della cascata 0033/0034.
      - name: Il database ricostruito somiglia davvero alla produzione?
        run: |
          set -euo pipefail
          DB=$(supabase status -o env | grep -E '^DB_URL=' | head -1 | cut -d= -f2- | tr -d '"')
          psql "$DB" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_manca text;
          begin
            -- (a) la DML di base è tornata dove la produzione ce l'ha
            select 'authenticated non ha SELECT su companies' into v_manca
             where not exists (
               select 1 from information_schema.table_privileges
                where table_schema='public' and table_name='companies'
                  and grantee='authenticated' and privilege_type='SELECT');
            if v_manca is not null then raise exception '%', v_manca; end if;

            select 'service_role non ha INSERT su subsidy_sources' into v_manca
             where not exists (
               select 1 from information_schema.table_privileges
                where table_schema='public' and table_name='subsidy_sources'
                  and grantee='service_role' and privilege_type='INSERT');
            if v_manca is not null then raise exception '%', v_manca; end if;

            -- (b) e le restrizioni delle migrazioni NON sono state cancellate
            select 'la 0032 è stata annullata: authenticated ha INSERT su subsidy_sources' into v_manca
             where exists (
               select 1 from information_schema.table_privileges
                where table_schema='public' and table_name='subsidy_sources'
                  and grantee='authenticated' and privilege_type='INSERT');
            if v_manca is not null then raise exception '%', v_manca; end if;

            select 'la 0014 è stata annullata: authenticated ha UPDATE di tabella su email_messages' into v_manca
             where exists (
               select 1 from information_schema.table_privileges
                where table_schema='public' and table_name='email_messages'
                  and grantee='authenticated' and privilege_type='UPDATE'
                  and not exists (select 1 from information_schema.column_privileges
                                   where table_schema='public' and table_name='email_messages'
                                     and grantee='authenticated' and privilege_type='UPDATE'));
            if v_manca is not null then raise exception '%', v_manca; end if;

            raise notice 'privilegi ricostruiti: baseline presente, restrizioni intatte';
          end $$;
          SQL

      # Il catalogo non nasce con le migrazioni: è dato, non schema. `test:subsidy`
      # ha bisogno di UNA versione pubblicata e si rifiuta di crearsela da sé —
      # scrivere nel catalogo dentro un test sarebbe scrivere per tutti.
      # ⚠️ L'ordine conta: `subsidy_program_versions.program_id` punta a
      # `subsidy_programs`, quindi prima i programmi.
      - name: Seminare il catalogo
        run: |
          set -euo pipefail
          # ⚠️ `--write` SU ENTRAMBI. Senza, i due script girano in dry-run,
          #    stampano un'anteprima ed escono ZERO: il passo risultava
          #    superato dopo non aver scritto niente, e a fallire era la
          #    migrazione dopo, con una chiave esterna che sembrava un difetto
          #    dello schema. Un no-op che esce 0 è un fallback silenzioso.
          npm run subsidy:seed -- --write
          npm run subsidy:seed-catalog -- --write

          # E si CONTROLLA che il seed abbia davvero prodotto ciò che serve,
          # invece di fidarsi dell'exit code: `test:subsidy` ha bisogno di
          # almeno una versione PUBBLICATA e si rifiuta di crearsela da sé.
          DB=$(supabase status -o env | grep -E '^DB_URL=' | head -1 | cut -d= -f2- | tr -d '"')
          psql "$DB" -v ON_ERROR_STOP=1 -t -c "do \$\$
          declare n integer;
          begin
            select count(*) into n from public.subsidy_programs;
            if n = 0 then raise exception 'il seed dei programmi non ha scritto niente'; end if;
            select count(*) into n from public.subsidy_program_versions where status = 'published';
            if n = 0 then raise exception 'nessuna versione PUBBLICATA: test:subsidy non potrebbe provare niente'; end if;
            raise notice 'catalogo seminato: % versioni pubblicate', n;
          end \$\$;"

      # `--no-skip`: qui l'ambiente è completo per costruzione, quindi un
      # gruppo «saltato» sarebbe un guasto travestito da verde.
      - name: Le undici suite su database
        run: npm run test:db -- --no-skip

      - name: Spegnere Supabase
        if: always()
        run: supabase stop --no-backup

      - name: Rimuovere le credenziali dal runner
        if: always()
        run: rm -f .env.test .supabase-status

  # -------------------------------------------------------------------------
  # 3. I segreti ci sono? Si risponde SÌ o NO senza mai stampare un valore:
  #    `-n` verifica che la stringa non sia vuota e non la mostra.
  # -------------------------------------------------------------------------
  preflight:
    name: Segreti disponibili?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # ⚠️ Questo job non fa checkout, quindi la cartella `app/` non esiste sul
    # runner: senza questo override il `working-directory` ereditato dai
    # `defaults` farebbe fallire il passo con «no such directory».
    defaults:
      run:
        working-directory: .
    outputs:
      has_database: ${{ steps.probe.outputs.has_database }}
      has_anthropic: ${{ steps.probe.outputs.has_anthropic }}
    steps:
      - id: probe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "has_database=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_database=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Suite database non eseguibili::I segreti SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY non sono configurati in questo repository. Le suite su database NON sono state eseguite: non sono verdi, sono saltate. L'elenco lo stampa 'npm run suite -- --list'."
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "has_anthropic=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_anthropic=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Valutazioni AI non eseguibili::Il segreto ANTHROPIC_API_KEY non è configurato. Le valutazioni NON sono state eseguite: non sono verdi, sono saltate."
          fi

  # -------------------------------------------------------------------------
  # 4. Le tre suite che provano IL PROGETTO, non il prodotto. Manuali di
  #    proposito: ci scrivono dentro, ed è la produzione.
  # -------------------------------------------------------------------------
  production-suites:
    name: Suite sul progetto reale (manuale)
    needs: [preflight, quality-and-unit]
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.run_production
      && needs.preflight.outputs.has_database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # I test leggono le credenziali da `.env.test` (`node --env-file`).
      # `umask 077` prima di scrivere; nessun `set -x`; i valori non vengono
      # mai stampati e GitHub li maschera comunque nei log.
      - name: Comporre .env.test dai segreti del repository
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          umask 077
          {
            printf 'SUPABASE_URL=%s\n'               "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n'          "$SUPABASE_ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n'  "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'ANTHROPIC_API_KEY=%s\n'          "$ANTHROPIC_API_KEY"
          } > .env.test

      # `--no-skip`: qui l'ambiente DEVE essere completo. Se `.env.test` non
      # fosse valido, un «saltato» silenzioso sarebbe la bugia peggiore —
      # il job risulterebbe verde senza aver provato niente.
      #
      # ⚠️ E il gruppo `production` ha un requisito in più che nessun `if:` di
      # GitHub può esprimere: si RIFIUTA di girare se `SUPABASE_URL` punta a
      # `127.0.0.1`. Provare la configurazione di autenticazione di un database
      # effimero darebbe un verde che non significa niente.
      - name: Suite sul progetto reale
        run: npm run test:production -- --no-skip

      - name: Rimuovere le credenziali dal runner
        if: always()
        run: rm -f .env.test

  # -------------------------------------------------------------------------
  # 5. Le valutazioni AI. Mai automatiche: spendono denaro vero.
  # -------------------------------------------------------------------------
  ai-evaluations:
    name: Valutazioni AI (manuale, a consumo)
    needs: [preflight, quality-and-unit]
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.run_evaluations
      && needs.preflight.outputs.has_database == 'true'
      && needs.preflight.outputs.has_anthropic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Comporre .env.test dai segreti del repository
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          umask 077
          {
            printf 'SUPABASE_URL=%s\n'               "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n'          "$SUPABASE_ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n'  "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'ANTHROPIC_API_KEY=%s\n'          "$ANTHROPIC_API_KEY"
          } > .env.test

      # ⚠️ `eval:assistant` interroga il database reale e oggi NON è
      # deterministico: due esecuzioni consecutive hanno fallito due casi
      # diversi. Finché non è stato reso indipendente dai dati, questo job
      # va letto come una misura, non come un cancello.
      - name: Valutazioni
        run: npm run test:eval -- --allow-ai --no-skip --continue-on-error

      - name: Rimuovere le credenziali dal runner
        if: always()
        run: rm -f .env.test
