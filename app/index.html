<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI-Swisse — Admin AI & Subsidy AI per le PMI svizzere</title>
    <meta
      name="description"
      content="AI-Swisse trasforma lettere, moduli e bandi di Confederazione, Cantoni e Comuni in azioni concrete: spiegazioni semplici, scadenze, checklist e incentivi pertinenti."
    />
    <!--
      Solo il peso 400 viene precaricato: è quello del corpo del testo, l'unico
      che serve al primo dipinto. 500 e 600 li chiede il browser quando incontra
      la prima etichetta o il primo titolo, e a quel punto la pagina è già viva.
      Precaricarli tutti e tre metterebbe 75 KB davanti al contenuto per
      guadagnare su ciò che si legge dopo.
      `crossorigin` è obbligatorio anche per le risorse della propria origine:
      senza, il browser scarica il file DUE volte — una per il preload e una per
      il @font-face — perché le richieste di carattere viaggiano in modalità
      anonima. È l'errore silenzioso più comune di questa riga.
    -->
    <link
      rel="preload"
      href="/fonts/inter-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300A3FF'/%3E%3Cstop offset='1' stop-color='%234DEAFF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='6' fill='url(%23g)'/%3E%3Cpath d='M22.4 9.5C21.2 7.5 19.1 6.4 16.3 6.4 12.5 6.4 10 8.4 10 11.2c0 2.9 2.4 4.1 6.3 4.9 3.9.8 6 2.1 6 5.1 0 2.9-2.7 4.8-6.4 4.8-2.9 0-5.3-1.2-6.5-3.3' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
