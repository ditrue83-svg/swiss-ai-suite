<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Il documento statico parla ITALIANO, la lingua di riferimento: titolo,
      descrizione e lang servono a indicizzatori e primo dipinto. È una scelta,
      non una dimenticanza — e non è più sorvegliata a mano: il titolo qui
      sotto DEVE coincidere con common.docTitle del dizionario italiano
      (test:shell-unit li riconcilia), e al primo render I18nProvider riallinea
      lang e titolo alla lingua dell'utente. La descrizione resta statica:
      cambiarla a runtime non la farebbe leggere a nessun indicizzatore.
    -->
    <title>AI-Swisse — Admin AI per le PMI svizzere</title>
    <meta
      name="description"
      content="AI-Swisse trasforma lettere e moduli di Confederazione, Cantoni e Comuni in azioni concrete: spiegazioni semplici, scadenze e checklist."
    />
    <!--
      Solo il peso 400 viene precaricato: è quello del corpo del testo, l'unico
      che serve al primo dipinto. 500 e 600 li chiede il browser quando incontra
      la prima etichetta o il primo titolo, e a quel punto la pagina è già viva.
      Precaricarli tutti e tre metterebbe 75 KB davanti al contenuto per
      guadagnare su ciò che si legge dopo.
      `crossorigin` è obbligatorio anche per le risorse della propria origine:
      senza, il browser scarica il file DUE volte — una per il preload e una per
      il @font-face — perché le richieste di carattere viaggiano in modalità
      anonima. È l'errore silenzioso più comune di questa riga.
    -->
    <link
      rel="preload"
      href="/fonts/inter-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      La favicon porta lo STESSO marchio della barra laterale: il blocco con la
      sigla «AI». Tre cose da sapere prima di toccarla.

      PERCHÉ IN CONTORNI E NON IN TESTO. Qui non si può scrivere <text>AI</text>
      e chiedere Inter: un data: URI non carica risorse esterne — è tutto il
      punto della CSP — quindi il carattere lo sceglierebbe il browser, e il
      marchio sarebbe disegnato da un font di sistema diverso su ogni macchina.

      ⚠️ FINO AL 2026-08-14 QUESTA FAVICON ERA UN TERZO DISEGNO. Portava sì i
      contorni del titolare, ma su un riquadro suo (`14.2 31.9 301.8 301.8`),
      con gli angoli arrotondati (`rx='56.6'`) e i tracciati riscritti a una
      cifra decimale — mentre la vetrina serve `20 20 300 326`, spigoli vivi e
      i numeri per intero. E il campo era `--accent`, il blu D'AZIONE, non il
      blu del marchio. Il commento di allora sosteneva che «una scheda aperta su
      ai-swisse.com e una aperta sull'applicazione mostrano lo stesso segno»:
      non era vero, erano due segni simili di due colori diversi.
      Adesso questo documento è `site/static/favicon.svg` carattere per
      carattere, solo percent-encoded. `npm run brand:check` lo rilegge dalla
      vetrina e fallisce se divergono.

      PERCHÉ I COLORI SONO SCRITTI PER ESTESO. Un data: URI non può dire
      var(--brand): i due valori sono copiati dai token del marchio, e
      `test:shell-unit` li rilegge da app.css pretendendoli letterali qui. Se il
      marchio cambia, quel rosso è il promemoria che la favicon non si aggiorna
      da sola.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='20 20 300 326'%3E %3Crect x='20' y='20' width='300' height='326' fill='%2337AEEF'/%3E %3Cpath d='M166.34302325581393 231.61627906976744H109.98255813953489L100.94767441860465 258.2906976744186H62.44186046511628L117.0813953488372 107.27906976744185H159.67441860465118L214.31395348837208 258.2906976744186H175.37790697674419ZM156.87790697674419 203.22093023255815 138.1627906976744 147.93604651162792 119.66279069767441 203.22093023255815Z M267.6627906976744 107.27906976744185V258.2906976744186H230.87790697674419V107.27906976744185Z' fill='%23ffffff'/%3E %3C/svg%3E"
    />
    <!--
      ⚠️ `theme-color` non è decorazione: è il colore che il telefono dipinge
      attorno alla pagina (barra di stato su Android, bordo della scheda). Senza,
      resta bianco anche in tema scuro e l'app sembra tagliata a metà. Il valore
      viene da `--card` di app.css, non dal marchio: è la superficie che
      continua, non il segno.

      ⚠️⚠️ UNA SOLA DICHIARAZIONE, SENZA `media`, dal 2026-08-16. Erano due,
      legate a `prefers-color-scheme`: da quando il tema lo sceglie l'APP, quelle
      due avrebbero fatto seguire al telefono il SISTEMA mentre l'app segue sé
      stessa — barra scura sopra un'app chiara. Il valore lo scrive lo script qui
      sotto, insieme al tema. Quello scritto qui è il predefinito del prodotto:
      è ciò che si vede se JavaScript non parte, ed è il chiaro, come dev'essere.

      `color-scheme` fa lo stesso lavoro per i controlli del SISTEMA (barra di
      scorrimento, tendine, calendari): il CSS lo ridichiara, questo meta serve
      nell'istante prima che il CSS arrivi.
    -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <!--
      ⚠️⚠️ QUESTO SCRIPT DEVE RESTARE IN LINEA, SINCRONO E NEL `<head>`. Un
      modulo dell'applicazione non può girare prima del primo fotogramma: se il
      tema si applicasse dopo, chi ha scelto «scuro» vedrebbe un lampo bianco a
      ogni caricamento. È l'unica ragione per cui questa logica esiste due volte.

      L'ALTRA COPIA è `src/lib/theme.ts`, ed è quella autorevole. Chiave, valori
      e predefinito sono gli stessi, e `test:shell-unit` rilegge questo file come
      testo per pretenderlo: se divergono, la suite è rossa. Chi cambia una
      copia deve cambiare l'altra — il controllo esiste perché quel «deve» da
      solo non ha mai funzionato in questo progetto.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('ai-swisse.tema');
          if (pref !== 'chiaro' && pref !== 'scuro' && pref !== 'sistema') pref = 'chiaro';
          var risolto = pref === 'sistema'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : (pref === 'scuro' ? 'dark' : 'light');
          var r = document.documentElement;
          r.setAttribute('data-theme', risolto);
          r.setAttribute('data-theme-pref', pref);
          if (risolto === 'dark') {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#1c232c');
            var s = document.querySelector('meta[name="color-scheme"]');
            if (s) s.setAttribute('content', 'dark');
          }
        } catch (e) {
          /* Deposito non leggibile: resta il predefinito chiaro del `:root` nudo. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
