# ============================================================================
# Configurazione Supabase VERSIONATA.
#
# ATTENZIONE — cosa legge cosa:
#   · Il progetto HOSTED (tcjmagaqktmzijbfntvy) NON legge questo file: le sue
#     impostazioni vivono nel dashboard. Questo file serve a (a) documentare la
#     configurazione attesa, in modo riproducibile e sotto controllo di versione,
#     e (b) far girare `supabase start` in locale con le stesse regole.
#   · Verifica che il progetto hosted sia allineato con:  npm run check:auth
#
# Le impostazioni Auth qui sotto sono quelle che, se sbagliate in produzione,
# rompono registrazione e reimpostazione password SENZA alcun errore visibile:
# il link nell'email punta altrove e l'utente non completa mai il flusso.
# ============================================================================

project_id = "swiss-ai-suite"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
# Deve restare allineato al bucket `company-documents` (vedi migrazione 0009).
file_size_limit = "15MiB"

[auth]
# ---------------------------------------------------------------------------
# site_url — dove Supabase rimanda quando un redirect NON è nell'allowlist.
# In produzione va impostato al dominio reale dell'applicazione. Sul progetto
# hosted questo valore si cambia in: Authentication → URL Configuration.
# ---------------------------------------------------------------------------
# Valore applicato al progetto hosted il 2026-07-26 (Management API):
#   site_url = https://app.ai-swisse.com
# Qui resta l'URL locale, perché questo file configura `supabase start`.
site_url = "http://localhost:5174"

# ---------------------------------------------------------------------------
# additional_redirect_urls — allowlist dei redirect ammessi nei link via email
# (conferma registrazione, reimposta password). Un URL non elencato viene
# ignorato e sostituito con site_url: è anche la difesa contro gli open redirect.
# Aggiungere qui il dominio di produzione PRIMA di andare online.
# ---------------------------------------------------------------------------
additional_redirect_urls = [
  "http://localhost:5174/**",
  # Allowlist realmente applicata al progetto hosted (2026-07-26):
  #   https://app.ai-swisse.com/**       ← dominio di produzione
  #   https://swiss-ai-suite.pages.dev/** ← indirizzo Cloudflare, tenuto come rete di sicurezza
  #   http://localhost:5174/**            ← sviluppo
  # Verificabile in ogni momento con: npm run check:auth -- https://app.ai-swisse.com
]

jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Registrazione aperta: l'onboarding crea azienda + membership owner.
enable_signup = true

[auth.email]
enable_signup = true
# Conferma dell'indirizzo email prima dell'accesso. In produzione va tenuta
# ATTIVA: senza, chiunque può registrarsi con l'email di un altro.
enable_confirmations = true
double_confirm_changes = true
# NB: il servizio email predefinito di Supabase ha limiti stretti ed è pensato
# solo per lo sviluppo. Per la produzione va configurato un SMTP proprio
# (dashboard → Authentication → Emails → SMTP Settings), altrimenti le email di
# conferma e reset possono semplicemente non arrivare.

[auth.email.template.confirmation]
subject = "Conferma il tuo indirizzo email — AI-Swisse"

[auth.email.template.recovery]
subject = "Reimposta la password — AI-Swisse"

# ============================================================================
# Edge Functions — verifica del JWT
#
# Per impostazione predefinita Supabase respinge una richiesta a una Edge
# Function se non porta un JWT valido, PRIMA che il codice della funzione venga
# eseguito. Per la maggior parte delle funzioni è quello che si vuole. Per due
# di queste no, e la ragione è nella natura del chiamante:
#
#   email-webhook      lo chiamano Google Pub/Sub e Microsoft Graph, che non
#                      hanno una sessione Supabase e non possono averla. La
#                      richiesta viene autenticata DENTRO la funzione: token
#                      OIDC firmato da Google verificato contro le sue chiavi
#                      pubbliche, `clientState` per Microsoft. Vedi §25 di
#                      docs/ai-inbox.md.
#   email-oauth        il callback è una GET del browser di ritorno dal
#                      consenso: non porta il JWT dell'utente. La sicurezza sta
#                      nello `state` monouso, e i percorsi /start e /providers
#                      verificano l'autenticazione nel codice (401 se manca).
#   email-maintenance  lo chiama uno scheduler, non una persona. Autenticato con
#                      un segreto confrontato a tempo costante.
#
# ⚠️ Questo file NON viene applicato al progetto hosted: al momento del deploy
# va passato `--no-verify-jwt` alle tre funzioni. Il comando esatto è in
# docs/ai-inbox.md. Se lo si dimentica, i webhook ricevono 401 e la posta
# smette di arrivare in tempo reale — senza alcun errore visibile nell'app,
# perché la riconciliazione periodica continua a funzionare.
# ============================================================================
[functions.email-webhook]
verify_jwt = false

[functions.email-oauth]
verify_jwt = false

[functions.email-maintenance]
verify_jwt = false

# ⚠️ DICHIARATA ESPLICITAMENTE, e la ragione va ricordata. Questo file elencava
# solo le funzioni con il gate SPENTO; per le altre non si mandava nulla, e la
# piattaforma teneva l'ultimo valore impostato. Il 2026-08-01 un
# `--no-verify-jwt` di troppo su questa funzione ha spento il gate, e il
# rideploy SENZA quel flag non l'ha riacceso: il valore si porta dietro se
# stesso finché qualcuno non lo dichiara. È il gemello della trappola di
# `calendar-sync`, che era rimasta con il gate ACCESO e rispondeva 401 al
# segreto giusto. `email-sync` è chiamata dal browser con il JWT dell'utente:
# il gate ci vuole.
[functions.email-sync]
verify_jwt = true

# ---------------------------------------------------------------------------
# Calendario e notifiche (0018). Stessa logica, stessi chiamanti anomali:
#
#   calendar-oauth        il callback è una GET del browser di ritorno dal
#                         consenso: non porta il JWT dell'utente. La sicurezza
#                         sta nello `state` monouso, e /start e /providers
#                         verificano l'autenticazione nel codice (401 se manca).
#   notifications-worker  lo chiama uno scheduler, non una persona. Autenticato
#                         con un segreto confrontato a tempo costante.
#   calendar-sync         lo chiamano TRE soggetti, e ognuno si autentica NEL
#                         CODICE: lo scheduler (`drain`) e la diagnostica
#                         (`reconcile`) con `CALENDAR_WORKER_SECRET` confrontato
#                         a tempo costante, una persona (`sync`) con il proprio
#                         JWT — verificato da `authenticate()`, più la proprietà
#                         della connessione e `assertMember`. Senza JWT resta
#                         401 anche presentando il segreto del worker.
#
# ⚠️⚠️ QUI C'ERA SCRITTO IL CONTRARIO, e la riga sbagliata è costata un guasto.
# Questo file dichiarava che `calendar-sync` teneva `verify_jwt = true` di
# proposito «perché lo scheduler chiama comunque con la service role key
# nell'header Authorization». Quell'header NON C'È: il comando di
# `calendar-sync-drain` manda `Content-Type` e `x-calendar-worker-secret`, e
# nient'altro (si legge in `cron.job`, e ora anche nella migrazione 0035). Il
# risultato è stato 401 a ogni esecuzione, dal gate della piattaforma, PRIMA che
# il codice della funzione lo vedesse — la stessa trappola già pagata con
# `email-webhook`. Rideployata `--no-verify-jwt` il 2026-07-31; il progetto
# hosted oggi la porta a `false` (`npm run verify:deploy` lo rilegge).
#
# ⚠️ Questo file NON viene applicato al progetto hosted: al deploy va passato
# `--no-verify-jwt` a tutte e tre le funzioni. Il comando esatto è in
# docs/calendar-notifications.md.
# ---------------------------------------------------------------------------
[functions.calendar-oauth]
verify_jwt = false

[functions.notifications-worker]
verify_jwt = false

[functions.calendar-sync]
verify_jwt = false

# ---------------------------------------------------------------------------
# Finance Operations (0021). Stesso chiamante anomalo di sempre:
#
#   finance-worker  lo chiama uno scheduler, non una persona. Autenticato nel
#                   codice con `FINANCE_WORKER_SECRET`, confrontato a tempo
#                   costante: senza segreto 403, con quello sbagliato 403.
#
# ⚠️ Il segreto va impostato PRIMA del deploy (Edge Functions → Secrets):
# senza, la funzione risponde 503 CONFIG_MISSING e la coda non viene mai letta —
# le fatture restano in `pending` e nessuno se ne accorge, perché l'applicazione
# continua a funzionare in tutto il resto.
# ⚠️ Questo file NON viene applicato al progetto hosted: al deploy va passato
# `--no-verify-jwt` anche a questa funzione, come alle altre elencate sopra.
# ---------------------------------------------------------------------------
[functions.finance-worker]
verify_jwt = false

# ---------------------------------------------------------------------------
# ⚠️⚠️ LE QUATTRO DICHIARAZIONI MANCANTI — 2026-08-01
#
# Questo blocco chiude, per le funzioni toccate dal parser condiviso, la
# trappola che `email-sync` aveva pagato da sola: il file elencava SOLO le
# funzioni con il gate spento, e per tutte le altre non si mandava nulla. La
# piattaforma allora tiene l'ultimo valore impostato — cioè il gate di una
# funzione dipende dalla memoria del progetto invece che dal repository, e un
# flag di troppo in un deploy qualsiasi lo cambia per sempre in silenzio.
#
# I quattro valori qui sotto NON sono stati scelti a tavolino: sono quelli
# MISURATI sul progetto il 2026-08-01 con `npm run verify:deploy`
# (analyze-document v38 true · contract-worker v16 false · email-disconnect v16
# true · interpret-project v25 true). Dichiararli non cambia niente oggi e
# rende il deploy ripetibile domani, senza `--no-verify-jwt` a mano.
#
#   analyze-document   la chiama il browser con il JWT dell'utente.
#   email-disconnect   idem: è un gesto di una persona nelle impostazioni.
#   interpret-project  idem: parte dal modulo Incentivi.
#   contract-worker    lo chiama uno scheduler, non una persona. Si autentica
#                      NEL CODICE con `x-contract-worker-secret` confrontato a
#                      tempo costante: senza segreto risponde 403. Se il gate
#                      della piattaforma si accendesse, il cron prenderebbe 401
#                      a ogni esecuzione, per sempre, e nulla diventerebbe
#                      rosso — è esattamente ciò che è successo a
#                      `calendar-sync` per sei giorni.
# ---------------------------------------------------------------------------
[functions.analyze-document]
verify_jwt = true

[functions.email-disconnect]
verify_jwt = true

[functions.interpret-project]
verify_jwt = true

[functions.contract-worker]
verify_jwt = false
